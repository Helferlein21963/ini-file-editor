trigger:
  - main

pool:
  vmImage: 'windows-latest'

variables:
  pythonVersion: '3.14'
  PIP_CACHE_DIR: $(Pipeline.Workspace)/.pip
  # Manually set major and minor version here or override in Azure DevOps UI
  MAJOR_VERSION: '1'
  MINOR_VERSION: '0'

stages:
  - stage: Build
    displayName: 'Build and Test'
    jobs:
      - job: BuildJob
        displayName: 'Build ini-file-editor'
        steps:
          - checkout: self
            fetchDepth: 0

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: 'Use Python $(pythonVersion)'

          - task: Cache@2
            inputs:
              key: 'pip | "$(Agent.OS)" | requirements.txt'
              restoreKeys: |
                pip | "$(Agent.OS)"
              path: $(PIP_CACHE_DIR)
            displayName: 'Cache pip packages'

          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              pip install -r requirements-dev.txt
            displayName: 'Install dependencies'

          - script: |
              pip install pytest
              pytest tests/
            displayName: 'Run tests'

          - pwsh: |
              $patch = git rev-list --count HEAD
              Write-Host "Patch version: $patch"
              Write-Host "##vso[task.setvariable variable=PATCH_VERSION]$patch"
              $fileVersion = "$(MAJOR_VERSION).$(MINOR_VERSION).$patch"
              Write-Host "File version: $fileVersion"
              Write-Host "##vso[task.setvariable variable=FILE_VERSION]$fileVersion"
            displayName: 'Calculate patch version from commit count'

          - pwsh: |
              python scripts/generate_version_info.py $(MAJOR_VERSION) $(MINOR_VERSION) $(PATCH_VERSION)
            displayName: 'Generate version_info.txt ($(FILE_VERSION))'

          - script: |
              pip install pyinstaller
              pyinstaller ini-file-editor.spec
            displayName: 'Build executable with PyInstaller'

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: '$(Build.SourcesDirectory)/build-out'
              artifactName: 'ini-file-editor-build'
              publishLocation: 'Container'
            displayName: 'Publish executable artifact'
            condition: succeeded()

          # - task: PublishBuildArtifacts@1
          #   inputs:
          #     pathToPublish: '$(Build.SourcesDirectory)/build'
          #     artifactName: 'ini-file-editor-build-files'
          #     publishLocation: 'Container'
          #   displayName: 'Publish build files'
          #   condition: succeeded()
