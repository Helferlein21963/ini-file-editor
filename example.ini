# ---- NETZWERK-EINSTELLUNGEN ----






# ==== ANWENDUNGS-EINSTELLUNGEN ====
[application]
name = MyApplication
version = 2.3.1
debug = false
; Unterstützte Sprachen (kommagetrennt)
supported_languages = de,en,fr,es
default_language = de
timezone = Europe/Berlin
# Maximale Upload-Größe in Megabyte
max_upload_mb = 50.34
temp_dir = /tmp/myapp
; Session-Timeout in Minuten
session_timeout = 60
; DUPLIKAT-TEST: zweiter session_timeout — Win32 GetPrivateProfileString
; sieht nur den ersten Wert (60); dieser hier (90) bleibt unsichtbar.
session_timeout = 90
secret_key = very-secret-key-change-in-production




[cache]
# Cache-Backend Konfiguration
backend = redis
host = cache-01.internal
port = 6379
db = 0
; TTL (Time-To-Live) in Sekunden
default_ttl = 3600
max_entries = 10000
; Passwort für Redis (leer = kein Auth)
password = 




[database]
# -----------------------------------------------
# Datenbank-Konfiguration (PostgreSQL)
# Bitte Zugangsdaten nicht in die Versionskontrolle!
# -----------------------------------------------
password = s3cr3tP@ssw0rd  ; ACHTUNG: Produktions-Passwort!
username = app_user
host = db-primary.internal
port = 5432
dbname = myapp_production
; Verbindungspool-Einstellungen
max_connections = 20
min_connections = 2
connect_timeout = 10
application_name = MyApp




[email]
; ---- SMTP Konfiguration ----
smtp_host = mail.example.com
smtp_port = 587
smtp_user = noreply@example.com
smtp_password = mailP@ssword123
use_tls = true
from_name = MyApplication
from_address = noreply@example.com
# Maximale Anzahl an Empfängern pro Mail
max_recipients = 50




[features]
# Feature-Flags für schrittweises Rollout
; Neues Dashboard (Beta)
new_dashboard = false
; Erweiterte Suche
advanced_search = true
api_v2 = true
; Experimentelle ML-Funktionen
ml_recommendations = false
dark_mode = true
# Zwei-Faktor-Authentifizierung
two_factor_auth = true




[logging]
; Logging-Konfiguration
level = INFO
file = /var/log/myapp/application.log
max_size_mb = 100
backup_count = 5
# Format-String für Log-Einträge
format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
encoding = utf-8
; Bei true: Logs auch auf die Konsole ausgeben
console_output = false

[network]
timeout = 30
; Der Hostname des primären Servers
host = prod-server-01.example.com
port = 8080
# Verbindungswiederholungen bei Fehler
retry_count = 3
ssl_enabled = true
; CA-Zertifikat für SSL-Verifikation
ssl_ca_cert = /etc/ssl/certs/ca-bundle.crt
connection_pool_size = 10
keep_alive = true




[paths]
base_dir = /opt/myapp
static_dir = /opt/myapp/static
media_dir = /opt/myapp/media
; Konfigurations-Verzeichnis
config_dir = /etc/myapp
log_dir = /var/log/myapp
# Temporäres Verzeichnis
temp_dir = /tmp/myapp
backup_dir = /backup/myapp

; ============================================================
; DUPLIKAT-TEST: zweite [network]-Section mit anderen Keys.
; Win32 GetPrivateProfileString sieht ausschließlich die erste
; [network]-Section weiter oben. Die folgenden Keys (failover_host,
; failover_port) bleiben für Win32-Konsumenten komplett unsichtbar.
; ============================================================
[network]
failover_host = prod-server-02.example.com
failover_port = 8081
; Auch ein duplizierter Key wäre hier wirkungslos
timeout = 99

; ============================================================
; Ende der Konfigurationsdatei
; Änderungen erfordern einen Neustart der Anwendung.
; ============================================================
