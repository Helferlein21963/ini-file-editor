; ============================================================
; Beispiel-Konfiguration (ANSI / Windows-1252 kodiert)
; Erstellt fuer: Buero-Anwendung v1.0
; Autor: Juergen Muehlbauer
; ============================================================

[allgemein]
; Anwendungsname mit Umlauten
name = Büro-Verwaltung Süd
version = 1.0.0
; DUPLIKAT-TEST: zweiter version-Key. Win32 GetPrivateProfileString
; liefert nur den ersten Wert (1.0.0); dieser hier (1.0.1) bleibt unsichtbar.
version = 1.0.1
; Sprache und Region
sprache = Deutsch (Österreich)
währung = Euro

[benutzer]
; Benutzerprofil-Einstellungen
vorname = Jürgen
nachname = Mühlbauer
straße = Hauptstraße 42
ort = München
plz = 80331
; Freitext mit Sonderzeichen
notiz = Bitte Angebote in Euro angeben

[preise]
; Preise in Euro
grundpreis = 19,99 €
aufpreis_express = 5,00 €
rabatt_stammkunde = 10%
; MwSt.-Hinweis
mwst_hinweis = inkl. 19% MwSt. (Brutto)

[pfade]
basis_verzeichnis = C:\Programme\Büro-Verwaltung
daten_verzeichnis = C:\Benutzer\Dokumente\Büro
; Sicherungspfad
backup_pfad = D:\Sicherung\Büro

[email]
; SMTP-Konfiguration fuer deutschen Mailserver
smtp_host = mail.beispiel.de
smtp_port = 587
absender_name = Büro Mühlbauer
absender_adresse = info@buero-muehlbauer.de
use_tls = true

; ============================================================
; DUPLIKAT-TEST: zweite [email]-Section mit anderen Keys.
; Win32 GetPrivateProfileString sieht ausschliesslich die erste
; [email]-Section weiter oben; folgende Keys bleiben unsichtbar.
; ============================================================
[email]
smtp_backup_host = backup-mail.beispiel.de
smtp_backup_port = 2525
; Auch ein duplizierter Key waere hier wirkungslos
smtp_host = mail-zweit.beispiel.de

; ============================================================
; Ende der Konfiguration
; Sonderzeichen: ä ö ü ß €
; ============================================================
