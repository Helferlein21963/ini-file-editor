sprache = Deutsch (Österreich)
währung = Euro

[benutzer]
; Benutzerprofil-Einstellungen
vorname = Jürgen
nachname = Mühlbauer
straße = Hauptstraße 42
ort = München
plz = 80331
; Freitext mit Sonderzeichen
notiz = Bitte Angebote in Euro angeben

[preise]
; Preise in Euro
grundpreis = 19,99 €
aufpreis_express = 5,00 €
rabatt_stammkunde = 10%
; MwSt.-Hinweis
mwst_hinweis = inkl. 19% MwSt. (Brutto)

[pfade]
